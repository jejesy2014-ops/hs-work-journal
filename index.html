    if(typeof window!=="undefined") window.addEventListener("online",function(){ if(dirty&&!blocked) api.retry(); });
    return api;
  }

  function el(tag,props,style){ const e=document.createElement(tag); if(props) Object.assign(e,props); if(style) Object.assign(e.style,style); return e; }

  function showReset(){
    root.innerHTML="";
    const wrap=el("div",{},{position:"fixed",top:0,right:0,bottom:0,left:0,display:"flex",alignItems:"center",justifyContent:"center",overflow:"auto",padding:"20px",paddingTop:"calc(20px + env(safe-area-inset-top))",paddingBottom:"calc(20px + env(safe-area-inset-bottom))",background:C.paper,fontFamily:"'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif"});
    const card=el("div",{},{width:"100%",maxWidth:"360px",background:C.card,border:"1px solid "+C.line,borderRadius:"16px",padding:"24px"});
    const h=el("div",{textContent:"새 비밀번호 설정"},{fontSize:"20px",fontWeight:"700",color:C.ink,marginBottom:"4px"});
    const sub=el("div",{textContent:"새로 사용할 비밀번호를 입력하세요."},{fontSize:"12px",color:C.sub,marginBottom:"18px"});
    const pw=el("input",{type:"password",placeholder:"새 비밀번호 (6자 이상)"},{width:"100%",boxSizing:"border-box",padding:"11px",fontSize:"14px",border:"1px solid "+C.line,borderRadius:"10px",marginBottom:"14px",outline:"none"});
    const msg=el("div",{},{fontSize:"12px",color:C.danger,marginBottom:"10px",minHeight:"16px",lineHeight:"1.4"});
    const btn=el("button",{textContent:"비밀번호 변경"},{width:"100%",padding:"12px",fontSize:"14px",fontWeight:"600",color:C.btnText,background:C.btn,border:"none",borderRadius:"10px",cursor:"pointer"});
    function setMsg(t,ok){
      msg.textContent=t;
      msg.style.color=ok?C.forest:C.danger;
      msg.style.background=ok?C.forestSoft:"transparent";
      msg.style.border=ok?`1px solid ${C.line}`:"none";
      msg.style.borderRadius=ok?"10px":"0";
      msg.style.padding=ok?"10px":"0";
      msg.style.fontWeight=ok?"600":"400";
    }
    btn.onclick=async()=>{ if(pw.value.length<6){ setMsg("비밀번호는 6자 이상이어야 해요."); return; } btn.disabled=true; const {error}=await supa.auth.updateUser({password:pw.value}); btn.disabled=false; if(error){ setMsg(error.message); return; } setMsg("변경됐어요. 잠시 후 앱으로 이동해요.",true); setTimeout(()=>{ try{ history.replaceState(null,"",location.pathname); }catch(e){} location.reload(); },1200); };
    card.appendChild(h); card.appendChild(sub); card.appendChild(pw); card.appendChild(msg); card.appendChild(btn); wrap.appendChild(card); root.appendChild(wrap);
  }

  function showLogin(prefill){
    root.innerHTML="";
    const wrap=el("div",{},{position:"fixed",top:0,right:0,bottom:0,left:0,display:"flex",alignItems:"center",justifyContent:"center",overflow:"auto",padding:"20px",paddingTop:"calc(20px + env(safe-area-inset-top))",paddingBottom:"calc(20px + env(safe-area-inset-bottom))",background:`radial-gradient(circle at 50% 0%, ${C.forestSoft} 0, transparent 270px), ${C.paper}`,fontFamily:"'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif"});
    const card=el("div",{},{width:"100%",maxWidth:"380px",background:C.card,border:"1px solid "+C.line,borderRadius:"20px",padding:"24px",boxShadow:"0 18px 50px rgba(0,0,0,.08)"});
    const lockup=el("div",{className:"wj-brand-lockup"});
    lockup.appendChild(el("span",{className:"wj-brand-mark","aria-hidden":"true"}));
    lockup.appendChild(el("span",{textContent:"기록이 쌓여 성과가 되는 일지",className:"wj-brand-lockup-text"}));
    const badge=el("div",{textContent:"개인 업무일지"},{display:"inline-flex",alignItems:"center",height:"26px",padding:"0 10px",borderRadius:"999px",background:C.forestSoft,color:C.forest,fontSize:"12px",fontWeight:"700",marginBottom:"12px"});
    const h=el("div",{textContent:"나의 일지"},{fontSize:"26px",fontWeight:"800",letterSpacing:"-0.03em",color:C.ink,marginBottom:"6px"});
    const sub=el("div",{innerHTML:"오늘의 일을 기록하고,<br>쌓인 기록으로 나의 성장을 확인해요"},{fontSize:"14px",color:C.sub,marginBottom:"18px",lineHeight:"1.55"});
    const flowTitle=el("div",{textContent:"기록이 쌓이는 흐름"},{fontSize:"11px",fontWeight:"700",color:C.sub,marginBottom:"7px"});
    const flow=el("div",{},{display:"grid",gridTemplateColumns:"1fr 18px 1fr 18px 1fr",alignItems:"center",gap:"4px",marginBottom:"12px"});
    ["오늘의 일","쌓인 기록","나의 성과"].forEach(function(label,i){
      if(i>0) flow.appendChild(el("div",{textContent:"→"},{textAlign:"center",color:C.sub,fontSize:"13px",fontWeight:"700"}));
      flow.appendChild(el("div",{textContent:label},{padding:"9px 8px",borderRadius:"12px",textAlign:"center",fontSize:"12px",fontWeight:"800",color:i===2?C.btnText:C.forest,background:i===2?C.btn:C.forestSoft,border:"1px solid "+(i===2?C.btn:C.line)}));
    });
    const preview=el("div",{},{border:"1px solid "+C.line,borderRadius:"16px",padding:"14px",background:`linear-gradient(180deg, ${C.card}, ${C.forestSoft})`,marginBottom:"18px"});
    const previewTop=el("div",{},{display:"flex",justifyContent:"space-between",alignItems:"center",gap:"10px",marginBottom:"10px"});
    previewTop.appendChild(el("div",{textContent:"쌓인 기록"},{fontSize:"12px",fontWeight:"800",color:C.ink}));
    previewTop.appendChild(el("div",{textContent:"성장 기록 3건"},{fontSize:"11px",fontWeight:"800",color:C.forest,background:C.card,border:"1px solid "+C.line,borderRadius:"999px",padding:"5px 8px",whiteSpace:"nowrap"}));
    preview.appendChild(previewTop);
    ["제안서 초안 정리","고객 응대 기록","교육 이수"].forEach(function(title){
      const row=el("div",{},{display:"flex",alignItems:"center",gap:"8px",padding:"6px 0",fontSize:"12px",color:C.ink});
      row.appendChild(el("span",{textContent:"✓"},{width:"18px",height:"18px",display:"inline-flex",alignItems:"center",justifyContent:"center",borderRadius:"999px",background:C.forest,color:C.btnText,fontSize:"11px",fontWeight:"900",flex:"0 0 auto"}));
      row.appendChild(el("span",{textContent:title},{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}));
      preview.appendChild(row);
    });
    const previewFoot=el("div",{textContent:"필요할 때 이 기록을 성과와 업무보고로 꺼내 써요"},{marginTop:"8px",paddingTop:"10px",borderTop:"1px solid "+C.line,fontSize:"12px",fontWeight:"700",color:C.forest,lineHeight:"1.45"});
    preview.appendChild(previewFoot);
    const benefits=el("div",{},{display:"grid",gap:"7px",marginBottom:"18px"});
    [["성장 기록","내가 어떤 일을 해왔고 어떻게 발전했는지 확인해요."],["성과 데이터","이직이나 연봉협상 때 필요한 근거를 꺼내 써요."],["업무보고","원하면 쌓인 기록을 주간·월간 업무보고로 정리해요."]].forEach(function(item){
      const row=el("div",{},{display:"flex",alignItems:"baseline",gap:"8px",padding:"7px 9px",borderRadius:"10px",background:C.forestSoft});
      row.appendChild(el("strong",{textContent:item[0]},{fontSize:"11px",fontWeight:"800",color:C.forest,whiteSpace:"nowrap"}));
      row.appendChild(el("span",{textContent:item[1]},{fontSize:"11px",lineHeight:"1.4",color:C.sub}));
      benefits.appendChild(row);
    });
    const email=el("input",{type:"email",placeholder:"이메일",value:prefill||""},{width:"100%",boxSizing:"border-box",padding:"11px",fontSize:"14px",border:"1px solid "+C.line,borderRadius:"10px",marginBottom:"8px",outline:"none"});
    const pw=el("input",{type:"password",placeholder:"비밀번호 (6자 이상)"},{width:"100%",boxSizing:"border-box",padding:"11px",fontSize:"14px",border:"1px solid "+C.line,borderRadius:"10px",marginBottom:"14px",outline:"none"});
    const msg=el("div",{},{fontSize:"12px",color:C.danger,marginBottom:"10px",minHeight:"16px",lineHeight:"1.4"});
    const loginBtn=el("button",{textContent:"로그인"},{width:"100%",padding:"12px",fontSize:"14px",fontWeight:"600",color:C.btnText,background:C.btn,border:"none",borderRadius:"10px",marginBottom:"8px",cursor:"pointer"});
    const signBtn=el("button",{textContent:"처음이면 회원가입"},{width:"100%",padding:"12px",fontSize:"14px",fontWeight:"600",color:C.forest,background:C.card,border:"1px solid "+C.line,borderRadius:"10px",cursor:"pointer"});
    function setMsg(t,ok){ msg.textContent=t; msg.style.color=ok?C.forest:C.danger; }
    function busy(b){ loginBtn.disabled=b; signBtn.disabled=b; loginBtn.style.opacity=b?"0.6":"1"; }
    loginBtn.onclick=async()=>{ setMsg(""); if(!email.value||!pw.value){ setMsg("이메일과 비밀번호를 입력하세요."); return; } busy(true); const {data,error}=await supa.auth.signInWithPassword({email:email.value.trim(),password:pw.value}); busy(false); if(error){ setMsg(error.message); return; } startAppFor(data.user); };
    signBtn.onclick=async()=>{ setMsg(""); if(!email.value||!pw.value){ setMsg("이메일과 비밀번호를 입력하세요."); return; } if(pw.value.length<6){ setMsg("비밀번호는 6자 이상이어야 해요."); return; } busy(true); const {data,error}=await supa.auth.signUp({email:email.value.trim(),password:pw.value}); busy(false); if(error){ setMsg(error.message); return; } if(data.session){ startAppFor(data.session.user); } else { setMsg("회원가입 완료! 이메일 인증 링크를 눌러야 로그인할 수 있어요. 받은편지함과 스팸함을 확인한 뒤, 인증을 끝내고 로그인해 주세요.",true); } };
    const resetLink=el("button",{textContent:"비밀번호를 잊으셨나요?"},{width:"100%",marginTop:"12px",fontSize:"12px",color:C.sub,background:"none",border:"none",cursor:"pointer",textDecoration:"underline"});
    resetLink.onclick=async()=>{ setMsg(""); if(!email.value){ setMsg("먼저 이메일을 입력하세요."); return; } const {error}=await supa.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:location.origin+location.pathname}); if(error){ setMsg(error.message); return; } setMsg("재설정 메일을 보냈어요. 메일의 링크를 눌러 새 비밀번호를 정하세요.",true); };
    card.appendChild(lockup); card.appendChild(badge); card.appendChild(h); card.appendChild(sub); card.appendChild(flowTitle); card.appendChild(flow); card.appendChild(preview); card.appendChild(benefits); card.appendChild(email); card.appendChild(pw); card.appendChild(msg); card.appendChild(loginBtn); card.appendChild(signBtn); card.appendChild(resetLink); wrap.appendChild(card); root.appendChild(wrap);
  }

  function startAppFor(user){
    window.__auth = { email: user.email || "", signOut: async()=>{ if(!confirm("로그아웃할까요? (이 기기에서만 로그아웃돼요)")) return; await supa.auth.signOut(); location.reload(); } };
    window.storage=cloudStorage(user.id);
    root.innerHTML="";
    if(typeof window.__startApp==="function") window.__startApp();
  }

  supa.auth.onAuthStateChange((event)=>{ if(event==="PASSWORD_RECOVERY"){ showReset(); } });

  (async()=>{
    if(location.hash && location.hash.indexOf("type=recovery")>=0){ showReset(); return; }
    try{ const {data}=await supa.auth.getSession(); if(data && data.session && data.session.user){ startAppFor(data.session.user); return; } }catch(e){ console.error(e); }
    showLogin();
  })();
})();

</script>
